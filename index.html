<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scheduler</title>
  <style>
   /* Base layout */
body {
  font-family: Arial, sans-serif;
  background: #323258;
  color: #eee;
  max-width: 580px;
  margin: 20px auto;
  padding: 16px 18px;
  border-radius: 12px;
  /* border: 1px solid #444; */
}

/* Day radios: inline, evenly spaced */
.days {
  display: flex;
  align-items: center;
  gap: 10px;           /* space between items */
  flex-wrap: nowrap;   /* keep on one line */
  overflow: hidden;    /* prevent accidental wrap scroll */
}

.days label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 0;           /* remove default margin so it fits one row */
  cursor: pointer;
  padding: 6px 8px;    /* hit area */
  border-radius: 8px;
  background: rgba(255,255,255,0.05); /* subtle chip */
}

/* Keep your original colors by not changing accent */
input[type="radio"] {
  accent-color: #7f58e1; /* uses existing theme color; visual only, not a new color */
}

/* Inputs line-up and look cleaner */
input[type="time"] {
  width: 140px;
  padding: 6px 8px;
  border-radius: 8px;
  border: 1px solid #444;
  background: #2c2c4a;   /* same tone family */
  color: #eee;
  outline: none;
}
input[type="time"]:focus {
  box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
}

/* Button (no color change) */
button {
  background: #7f58e1;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  color: #000;
  cursor: pointer;
  font-weight: bold;
  margin-top: 15px;
  width: 100%;
}
button:hover {
  background: #9773f0;
  color: #fff;
}

/* Status text */
#status {
  margin-top: 12px;
  font-style: italic;
  color: #d1ebe7;
}

/* Small layout polish */
fieldset, label { border: 0; }
#scheduler-title {
  font-family: 'Almarai';
  font-size: 24px;
  font-weight: bold;
  color: #fff;
  text-align: center;
  margin-top: 5%;
  margin-bottom: 20px;
}

  </style>
</head>
<body>
  <div>
    <div id="scheduler-title">جدول صمام الملف اللولبي</div>
    <label>Repeat on:</label>
    <div class="days">
      <label><input type="radio" name="day" value="Mon"> Mo</label>
      <label><input type="radio" name="day" value="Tue" checked> Tue</label>
      <label><input type="radio" name="day" value="Wed"> Wed</label>
      <label><input type="radio" name="day" value="Thu"> Thu</label>
      <label><input type="radio" name="day" value="Fri"> Fri</label>
      <label><input type="radio" name="day" value="Sat"> Sat</label>
      <label><input type="radio" name="day" value="Sun"> Sun</label>
    </div>
  </div>


  <div style="margin-top: 12px;">
    <label>Start Time:</label>
    <input type="time" id="start-time" value="09:00" />
  </div>
  <div style="margin-top: 12px;">
    <label>End Time:</label>
    <input type="time" id="end-time" value="17:00" />
  </div>

  <button id="add-btn">➕ Add Schedule</button>

  <div id="status">Waiting for input...</div>

  <script>
    document.getElementById("add-btn").onclick = () => {
      const day = document.querySelector('input[name="day"]:checked').value;
      const start = document.getElementById("start-time").value;
      const end = document.getElementById("end-time").value;

      if (!day || !start || !end) {
        document.getElementById("status").textContent = "Please select day and times.";
        return;
      }

      document.getElementById("status").textContent = `Scheduled on ${day} from ${start} to ${end}`;
    };
  </script>
</body>
</html>
